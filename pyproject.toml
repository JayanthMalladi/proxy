[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-why"
version = "0.1.0"
description = "Ask a codebase's memory why the code is the way it is."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
proxy = "proxy_why.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
